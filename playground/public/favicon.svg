<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="stellarFlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Single fluid orbital path -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#2563eb" stroke-width="4" opacity="0.3" stroke-dasharray="25 15" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" stroke-dasharray="10 30" />
  
  <!-- Central 4-point Stellar Flow star -->
  <path 
    d="M 50 12 Q 50 50 88 50 Q 50 50 50 88 Q 50 50 12 50 Q 50 50 50 12 Z" 
    fill="url(#stellarFlowGrad)" 
    filter="url(#glow)" 
  />
</svg>